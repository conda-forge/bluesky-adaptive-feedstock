{% set name = "bluesky-adaptive" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 2f7591364fb83b2defd0a0fbf1b29ff889806b5f24a0354ca0bdb3143f416e01

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - bluesky-base >=1.14.2
    - networkx >=3
    - numpy
    - rich >=13
    # [all] extra
    - ax-platform >=1.3.0,<1.4
    - botorch >=0.18.0,<0.19.0
    - gpytorch
    - pytorch
    - bluesky-queueserver-api
    - scipy >=1.2.0
    - xopt >3.0.0
    # required by bluesky-queueserver-api, but missing from its conda-forge package
    - websockets

test:
  imports:
    - bluesky_adaptive
    - bluesky_adaptive.ax
    - bluesky_adaptive.ax.queueserver_agent
    - bluesky_adaptive.bayesian
    - bluesky_adaptive.callbacks
    - bluesky_adaptive.queueserver
    - bluesky_adaptive.scipy
    - bluesky_adaptive.xopt
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/bluesky/bluesky-adaptive
  summary: Beamline optimization with machine learning
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thopkins32
    - maffettone
    - mrakitin
