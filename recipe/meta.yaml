{% set name = "bluesky-adaptive" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 4b14580b408bd54510376332cf2f3bc34f00c3956aa4068fc3603b66ce9012cf

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.7
    - pip
  run:
    - python >=3.7
    - bluesky
    - bluesky-live
    - bluesky-widgets
    - bluesky-kafka
    - bluesky-queueserver-api
    - xkcdpass
    - tiled
    - numpy
    - pydantic

test:
  imports:
    - bluesky_adaptive
    - bluesky_adaptive.adjudicators
    - bluesky_adaptive.adjudicators.base
    - bluesky_adaptive.adjudicators.msg
    - bluesky_adaptive.agents
    - bluesky_adaptive.agents.base
    - bluesky_adaptive.server

  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/bluesky/bluesky-adaptive
  summary: Tools for writing adaptive plans
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thopkins32
    - maffettone
    - mrakitin
